name: WordPress compatibility

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  install-latest:
    name: Install plugin on latest WordPress + WooCommerce
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Start database and WordPress
        run: docker compose up -d db wordpress

      - name: Wait for database
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T db mariadb-admin ping -h 127.0.0.1 -uroot -prootpassword --silent; then
              echo "Database is up"
              exit 0
            fi
            sleep 5
          done
          docker compose logs db || true
          exit 1
        timeout-minutes: 6

      - name: Wait for WordPress web server
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ]; then
              echo "WordPress container is up (HTTP $code)"
              exit 0
            fi
            sleep 5
          done
          docker compose logs wordpress || true
          exit 1
        timeout-minutes: 6

      - name: Install WordPress and WooCommerce
        run: |
          docker compose run --rm wp-cli sh -c "
            wp core install --url='http://localhost:8081' --title='WooCommerce Store' --admin_user='admin' --admin_password='password' --admin_email='admin@example.com' --allow-root &&
            wp option update siteurl 'http://localhost:8081' --allow-root &&
            wp option update home 'http://localhost:8081' --allow-root &&
            wp plugin install woocommerce --activate --allow-root
          "
        timeout-minutes: 15

      - name: Activate the Pricee plugin
        run: docker compose run --rm wp-cli wp plugin activate pricee --allow-root

      - name: Check the plugin is active and the shop responds
        run: |
          docker compose run --rm wp-cli wp plugin list --status=active --field=name --allow-root | grep -qx pricee
          curl -sf -o /dev/null http://127.0.0.1:8081/
          echo "pricee is active on latest WordPress + WooCommerce"

      - name: Stop services
        if: always()
        run: docker compose down -v
